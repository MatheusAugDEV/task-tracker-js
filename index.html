<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101316" />
    <title>Task Tracker — Minhas tarefas</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="app.js?v=2" defer></script>
  </head>
  <body>
    <header class="top-bar">
      <div class="top-bar-inner">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Task Tracker</span>
      </div>
    </header>

    <main class="app-shell">
      <header class="page-header">
        <h1>Minhas tarefas</h1>
      </header>

      <div class="workspace">
        <div class="task-workspace">
          <section class="task-panel" aria-labelledby="form-title">
            <h2 id="form-title">Nova tarefa</h2>
            <form id="task-form" novalidate>
              <label class="visually-hidden" for="task-title">Título da tarefa</label>
              <div class="form-row">
                <input
                  id="task-title"
                  name="title"
                  type="text"
                  placeholder="Ex.: revisar o projeto"
                  autocomplete="off"
                  aria-describedby="form-message"
                />
                <button class="primary-button" type="submit"><span aria-hidden="true">+</span> Adicionar tarefa</button>
              </div>
              <p id="form-message" class="form-message" aria-live="polite"></p>
            </form>
          </section>

          <section class="list-section" aria-labelledby="list-title">
            <div class="list-heading">
              <h2 id="list-title">Sua lista</h2>
              <span id="task-count" class="task-count">0 tarefas</span>
            </div>
            <div class="filter-controls" role="group" aria-label="Filtrar tarefas por status">
              <button class="filter-button" type="button" data-filter="all" aria-pressed="true">Todas</button>
              <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">Pendentes</button>
              <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Concluídas</button>
            </div>
            <div id="empty-state" class="empty-state">
              <span class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></span>
              <p id="empty-message">Sua lista está vazia. Adicione sua primeira tarefa acima.</p>
            </div>
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
          </section>
        </div>

        <aside class="overview" aria-labelledby="overview-title">
          <h2 id="overview-title">Progresso</h2>
          <div id="completion-progress" class="progress-ring" role="progressbar" aria-label="Porcentagem de tarefas concluídas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="completion-percent" aria-hidden="true">0%</span>
          </div>
          <dl class="progress-totals">
            <div><dt>Pendentes</dt><dd id="pending-total">0</dd></div>
            <div><dt>Concluídas</dt><dd id="completed-total">0</dd></div>
          </dl>
        </aside>
      </div>
    </main>
  </body>
</html>
