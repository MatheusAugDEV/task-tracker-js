<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Minhas tarefas</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">ORGANIZAÇÃO PESSOAL</p>
        <h1>Minhas tarefas</h1>
        <p class="intro">Um passo de cada vez. Anote o que você precisa fazer.</p>
      </header>

      <section class="task-panel" aria-labelledby="form-title">
        <h2 id="form-title">Nova tarefa</h2>
        <form id="task-form" novalidate>
          <label for="task-title">Título da tarefa</label>
          <div class="form-row">
            <input
              id="task-title"
              name="title"
              type="text"
              placeholder="Ex.: revisar o projeto"
              autocomplete="off"
              aria-describedby="form-message"
            />
            <button type="submit">Adicionar tarefa</button>
          </div>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="list-heading">
          <h2 id="list-title">Sua lista</h2>
          <span id="task-count" class="task-count">0 tarefas</span>
        </div>
        <div class="filter-controls" role="group" aria-label="Filtrar tarefas por status">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">Todas</button>
          <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">Pendentes</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Concluídas</button>
        </div>
        <p id="empty-state" class="empty-state">Sua lista está vazia. Adicione sua primeira tarefa acima.</p>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
